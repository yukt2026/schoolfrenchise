    <linearGradient id="watermarkGrad_python" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="375" fill="url(#grad_python)" rx="0" />
  
  <circle cx="510" cy="70" r="150" fill="url(#accentGrad_python)" opacity="0.18" filter="blur(30px)" />
  <circle cx="50" cy="310" r="120" fill="#0284c7" opacity="0.15" filter="blur(25px)" />
  
  <text x="560" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="130" font-weight="900" fill="url(#watermarkGrad_python)" text-anchor="end" letter-spacing="-2">PYTHON</text>

  <g transform="translate(35, 40)">
    <rect width="160" height="28" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1" />
