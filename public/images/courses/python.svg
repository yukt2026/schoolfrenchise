    <text x="28" y="19" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.6">TECH ERA COMPUTER</text>
  </g>
  
  <g transform="translate(440, 40)">
